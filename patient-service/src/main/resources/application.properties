#above makes sure our db is always in sync with our Patient Entity

#Below we are basically telling spring kafka code that our messages are going to have a key of String and a value of ByteArray
#This is helpful for the kafka template class to tell it what type of our message instead of it trying to figure it out itself cuz sometimes it can get it wrong.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer




server.port=4000
#For All our microservices we will have under 4k range like 4001 , 4002, and so on,
# just a convention we are following here.

logging.level.root=info
#Above means we are telling our Spring app that we need all the info. warn and error messages
#be logged to the terminal or console
